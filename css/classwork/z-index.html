<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            position:absolute;
            left:0px;
            top: 0px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <img src="WhatsApp Image 2026-10-05 at 23.18.45.jpeg" width="300px" height="300px">
    <h1> this is a heading</h1>
    <p> because the image has a z-index of -1 , it will be placed behind the text.</p>
</body>
</html>
