<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: dodgerblue;
        }
        .container div{
            background-color: #e8e2e2;
            margin: 10px;
            padding: 20px;
            font-size: 24px;
           
        }
    </style>

</head>
<body>
    <h1> Create a Flex container</h1>
    <div class="container">
        <div>item1</div>
        <div>item2</div>
        <div>item3</div>
    </div>
    <p> Flexbox must have a parent element with the display propertyy set to flex or inline-flex</p>
    <p>Direct child elememts of the flex container automatically becomes flex items.</p>
</body>
</html>
