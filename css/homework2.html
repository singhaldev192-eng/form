<!DOCTYPE html>
<html lang="en">
<head>

    <title>position</title>
    <style>
      .divs{
            position:relative;
border:4px solid black;
 margin: 0 auto;  
/* padding:10px 10px; */

height:100vh;


        }
        #name{
position:absolute;
left:5px;
top:10px;
font-size: 25px;
color:rgb(8, 113, 243);
        }
          #name0{

color:rgb(8, 113, 243);
        }
          #name1{

left:5px;

        }
          #name2{

        }
        #name3{

left:50%;

        }
              #name5{

        }
            #name8{

bottom:50%;

color:rgb(8, 113, 243);
        }

        
    </style>
</head>
<body>

</html>
