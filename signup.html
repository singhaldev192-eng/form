<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Sign Up</legend>
        <h6>Please fill out the form below to create an account:</h6>
        <form action="/signup" method="post">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="repeat-password">Repeat Password:</label>
            <input type="password" id="repeat-password" name="repeat-password" required><br><br>
            <label for="remember-me">Remember Me:</label>
            <input type="checkbox" id="remember-me" name="remember-me"><br><br>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select><br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>
            <label for="repeat-password-terms">I agree to the terms and conditions</label><br><br>
            

            <input type="submit" value="Sign Up">
        </form>
    </fieldset>
    <h1>Sign Up</h1>
    </form>
</body>
</html>
