<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 2px solid black;
            height: 600px;
            width: 600px;
            border-radius: 10px;
            margin-left: 500px;
            margin-top: 20px;
            position: absolute;
            background-color: rgb(44, 12, 190);
        
        }
        .div2{
            border: 2px solid black;
            height: 300px;
            width: 200px;
            border-radius: 10px;
            margin-left: 200px; 
            margin-top: 50px; 
            position: relative;
            right: 200px;
            top: 250px;
            background-color: rgb(30, 255, 0);
        }
        #div1{
            position: absolute;
            color: white; 
            left: 550px;
        }
        #div2{
            position: absolute;
            left: 150px;
            
        }
    </style>
</head>

<body>
    <div>
        <p id="div1">div1</p>
        <div class="div2">
            <p id="div2">div2</p>
           
        </div>
    </div>
</body>

</html>
